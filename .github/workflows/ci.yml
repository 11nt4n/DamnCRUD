name: CI/CD Parallel Pytest (UAS PPL)

on:
  push:
    branches: [ "main", "uas2026" ]
  pull_request:
    branches: [ "main", "uas2026" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: badcrud
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: pdo, pdo_mysql

    - name: Setup Database
      run: mysql -h 127.0.0.1 -u root -proot123 badcrud < db/damncrud.sql

    - name: Start PHP Built-in Server
      run: php -S localhost:8000 &

    - name: Wait for server to start
      run: sleep 3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Testing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest selenium pytest-xdist

    - name: Run Pytest in Parallel
      run: pytest -n 2 test_crud.py
